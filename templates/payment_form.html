{% extends "base.html" %}
{% block title %}{{ 'Edit Payment' if payment else 'Add Payment' }}{% endblock %}

{% block content %}
<div class="page-head">
  <div>
    <h1>{{ 'Edit Payment' if payment else 'Add Payment' }}</h1>
    <p class="muted">Money contributed to the common dinner fund.</p>
  </div>
  <a href="{{ url_for('payments') }}" class="btn btn-ghost">&larr; Back</a>
</div>

<section class="card form-card">
  <form method="post" novalidate class="form"
        action="{{ url_for('edit_payment', payment_id=payment.id) if payment else url_for('add_payment') }}">
    <div class="field">
      <label for="person_name">Person Name <span class="req">*</span></label>
      <input type="text" id="person_name" name="person_name" maxlength="120" required
             placeholder="e.g. Raj"
             value="{{ request.form.get('person_name', payment.person_name if payment else '') }}">
    </div>

    <div class="field">
      <label for="amount">Amount (&#8377;) <span class="req">*</span></label>
      <input type="number" id="amount" name="amount" min="0.01" step="0.01" required
             placeholder="e.g. 300"
             value="{{ request.form.get('amount', payment.amount if payment else '') }}">
    </div>

    <div class="field">
      <label for="date">Date <span class="req">*</span></label>
      <input type="date" id="date" name="date" required
             value="{{ request.form.get('date', (payment.date.isoformat() if payment else today.isoformat())) }}">
    </div>

    <div class="field">
      <label for="note">Note <span class="muted">(optional)</span></label>
      <input type="text" id="note" name="note" maxlength="255"
             placeholder="e.g. Monthly contribution"
             value="{{ request.form.get('note', payment.note if payment else '') }}">
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary">{{ 'Save Changes' if payment else 'Add Payment' }}</button>
      <a href="{{ url_for('payments') }}" class="btn btn-ghost">Cancel</a>
    </div>
  </form>
</section>
{% endblock %}
